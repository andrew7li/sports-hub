name: Scrape starting goalies

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to scrape (YYYY-MM-DD). Defaults to today (Eastern) if left blank."
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape and write to Redis
        run: npm run scrape:goalies -- "${{ inputs.date }}"
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          SCRAPE_CALLBACK_SECRET: ${{ secrets.SCRAPE_CALLBACK_SECRET }}
